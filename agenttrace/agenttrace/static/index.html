<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentTrace — 回放工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="mark">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1c1a16" stroke-width="1.6">
      <rect x="1.5" y="1.5" width="17" height="17"/>
      <path d="M4 12.5 L8 8 L11 11 L16 5.5"/>
      <path d="M14.6 3.6 16.4 5.4" stroke="#d64522"/>
    </svg>
    <span class="brand">AgentTrace</span>
    <span class="sub">Replay Workbench</span>
  </div>
  <div class="spacer"></div>
  <button id="btn-refresh" class="btn">刷新列表</button>
</header>
<main>
  <aside id="attempt-list">
    <div class="rail-cap">Attempts</div>
    <div class="hint">加载中…</div>
  </aside>
  <section class="center-col">
    <div id="empty-hint" class="hint big">← 从左侧选择一次评测尝试，查看并回放它的执行轨迹</div>
    <div id="trace-view" class="hidden">
      <div id="summary"></div>
      <div id="controls">
        <span class="cbtn" id="btn-start" title="回到开头">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3v10M13 3 6 8l7 5"/></svg>
        </span>
        <span class="cbtn" id="btn-prev" title="上一步">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>
        </span>
        <span class="cbtn primary" id="btn-play" title="播放">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M2.5 1.5 10.5 6 2.5 10.5Z"/></svg>
        </span>
        <span class="cbtn" id="btn-next" title="下一步">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>
        </span>
        <span class="cbtn" id="btn-end" title="显示全部">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 3v10M3 3l7 5-7 5"/></svg>
        </span>
        <div class="scrub">
          <div id="scrub-ticks"></div>
          <div class="track"></div>
          <div class="fill" id="scrub-fill"></div>
          <div class="head" id="scrub-head"></div>
        </div>
        <select id="speed" class="speed" title="播放速度">
          <option value="1400">慢速</option>
          <option value="600" selected>常速</option>
          <option value="220">快速</option>
        </select>
        <span id="progress"></span>
      </div>
      <div id="timeline"></div>
    </div>
  </section>
  <aside id="detail-panel">
    <div class="tabs"><span class="tab on">事件详情</span><span class="tab">尝试元数据</span></div>
    <div id="event-detail"><div class="hint">选择尝试后，点击瀑布图中的事件查看完整详情</div></div>
    <div id="metafoot" class="metafoot">—</div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
